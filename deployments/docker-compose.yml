services:
  backend:
    build:
      context: ..
      dockerfile: deployments/backend.Dockerfile
    env_file:
      - ../backend/.env
    environment:
      PORT: ${PORT:-3000}
    restart: unless-stopped
    ports:
      - '3000:3000'

  frontend:
    build:
      context: ..
      dockerfile: deployments/frontend.Dockerfile
      args:
        # local docker compose default
        VITE_API_URL: ${VITE_API_URL:-http://backend:3000}
    restart: unless-stopped
    ports:
      - '80:80'
